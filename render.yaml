services:
  - type: web
    name: your-app-backend
    runtime: php-8.2  # Must specify exact PHP version
    repo: https://github.com/yourusername/your-repo.git
    plan: free
    region: oregon
    buildCommand: |
      composer install --no-dev
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
    startCommand: |
      # Create database directory in tmp (writable on free tier)
      mkdir -p /tmp/data
      touch /tmp/data/database.sqlite
      chmod 666 /tmp/data/database.sqlite
      
      # Run migrations
      php artisan migrate --force
      
      # Create storage link
      php artisan storage:link
      
      # Start the server
      php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /tmp/data/database.sqlite  # Use /tmp instead of /var
        