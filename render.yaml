services:
  - type: web
    name: your-app-backend
    runtime: php  # Just 'php', not 'php-8.2'
    repo: https://github.com/yourusername/your-repo.git
    plan: free
    region: oregon
    buildCommand: |
      composer install --no-dev
      cp .env.example .env
      php artisan key:generate
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
    startCommand: |
      # Create SQLite database in a writable location
      mkdir -p storage/app
      touch storage/app/database.sqlite
      chmod 666 storage/app/database.sqlite
      
      # Run migrations
      php artisan migrate --force
      
      # Create storage link
      php artisan storage:link
      
      # Start the server
      php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: storage/app/precious_hairmpire.sqlite