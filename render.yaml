services:
  - type: web
    name: Salon Backend
    runtime: 
      name: php
      version: 8.2  # This is the correct format for specifying PHP version
    repo: https://github.com/sbabatunde/Salon-Backend
    plan: free
    region: oregon
    buildCommand: |
      composer install --no-dev
      cp .env.example .env
      php artisan key:generate
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
    startCommand: |
      mkdir -p storage/app
      touch storage/app/precious_hairmpire.sqlite
      chmod 666 storage/app/precious_hairmpire.sqlite
      php artisan migrate --force
      php artisan storage:link
      php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /opt/render/project/src/storage/app/precious_hairmpire.sqlite